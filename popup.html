<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>书签同步</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      width: 300px;
      padding: 14px;
      margin: 0;
      color: #1f2328;
      background: #fff;
    }
    h1 { font-size: 15px; margin: 0 0 4px; }
    .sub { font-size: 12px; color: #6b7280; margin: 0 0 12px; }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .badge.on { background: #dcfce7; color: #166534; }
    .badge.off { background: #fee2e2; color: #991b1b; }
    .badge.syncing { background: #dbeafe; color: #1e40af; }
    .badge.done { background: #dcfce7; color: #166534; }
    .badge.warn { background: #fef3c7; color: #92400e; }
    button {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: #4f83cc;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: #3f6fb3; }
    button:disabled { background: #9ca3af; cursor: default; }
    button.secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      margin-top: 6px;
    }
    button.secondary:hover { background: #f3f4f6; }
    button.danger { color: #dc2626; border-color: #fca5a5; }
    button.danger:hover { background: #fef2f2; }
    .diag {
      margin-top: 10px;
      padding: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      font-size: 11px;
      line-height: 1.6;
      color: #374151;
      background: #f9fafb;
      max-height: 220px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    a { display: block; text-align: center; font-size: 12px; color: #4f83cc; margin-top: 10px; text-decoration: none; }
    #status {
      font-size: 12px;
      margin-top: 8px;
      color: #4b5563;
      min-height: 30px;
      line-height: 1.5;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
    }
    .err { color: #dc2626; }
    .ok { color: #16a34a; }
    .last-sync { font-size: 11px; color: #9ca3af; margin-top: 6px; }
    #stats { font-size: 11px; color: #6b7280; margin-top: 4px; line-height: 1.6; }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 2px solid #4f83cc;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: -1px;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>书签坚果云同步</h1>
  <p class="sub">Chrome / Edge 书签双向同步</p>

  <div class="row">
    <span>配置状态</span>
    <span id="cfgBadge" class="badge off">未配置</span>
  </div>
  <div class="row">
    <span>同步状态</span>
    <span id="engineBadge" class="badge off">空闲</span>
  </div>

  <div id="status"></div>
  <div id="stats"></div>
  <div id="lastSync" class="last-sync"></div>

  <button id="syncBtn">立即同步</button>
  <button id="diagBtn" class="secondary">诊断</button>
  <button id="resetTbBtn" class="secondary danger">重置删除记录（修复）</button>
  <div id="diag" class="diag" style="display:none"></div>
  <a href="#" id="openOptions">打开设置</a>

  <script src="popup.js"></script>
</body>
</html>
